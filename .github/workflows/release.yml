name: Release artifacts and migrate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.target }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish immutable images
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sgsst-api
          tags: |
            type=sha,format=long
            type=raw,value=${{ inputs.target }}-latest

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./sgsst-api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Validate web API base URL
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          test -n "$VITE_API_URL"
          case "$VITE_API_URL" in
            http://*|https://*) ;;
            *) echo "VITE_API_URL must start with http:// or https://"; exit 1 ;;
          esac
          case "$VITE_API_URL" in
            *localhost*|*127.0.0.1*) echo "VITE_API_URL cannot target localhost"; exit 1 ;;
          esac

      - name: Extract web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sgsst-web
          tags: |
            type=sha,format=long
            type=raw,value=${{ inputs.target }}-latest

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./sgsst-web
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  migrate:
    name: Apply Prisma migrations
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      deployment: false
    defaults:
      run:
        working-directory: sgsst-api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sgsst-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Reject local database targets
        run: |
          test -n "$DATABASE_URL"
          case "$DATABASE_URL" in
            *localhost*|*127.0.0.1*) echo "DATABASE_URL must target the selected environment"; exit 1 ;;
          esac

      - name: Deploy migrations
        run: npm run prisma:migrate:deploy
