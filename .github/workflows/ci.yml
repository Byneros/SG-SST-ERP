name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgsst-api
    # Redis real para readiness: getReadiness() exige database y redis en ok
    # (sin esto, /developer/overview reporta database: 'error' en CI y el
    # e2e developer.db-e2e-spec falla).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sgsst
      JWT_SECRET: ci-secret-change-in-production
      JWT_EXPIRES_IN: 1h
      REFRESH_TOKEN_EXPIRES_IN: 7d
      PASSWORD_RESET_EXPIRES_MINUTES: 30
      CORS_ORIGINS: http://localhost:5176
      PUBLIC_BASE_URL: http://localhost:3001
      UPLOADS_PATH: uploads
      DOCUMENT_STORAGE_DRIVER: local
      MAX_UPLOAD_BYTES: 10485760
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 120
      DASHBOARD_CACHE_TTL_SECONDS: 30
      NOTIFICATIONS_QUEUE_ENABLED: false
      NOTIFICATIONS_CRON: "0 7 * * *"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sgsst-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Unit tests
        run: npm run test -- --cacheDirectory=.jest-cache

      - name: E2E tests
        run: npm run test:e2e -- --cacheDirectory=.jest-cache

      - name: E2E integration with real PostgreSQL
        run: npm run test:e2e:db

      - name: Build
        run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgsst-web
    env:
      VITE_API_URL: http://localhost:3001/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sgsst-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      METRICS_TOKEN: ci-only-metrics-token-with-at-least-thirty-two-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

      - name: Prepare local .env (secretos CI validos para assertProductionEnv)
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=${JWT_SECRET}/" .env
          sed -i "s/^METRICS_TOKEN=.*/METRICS_TOKEN=${METRICS_TOKEN}/" .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Resuelve los tags que espera compose (prefijo de proyecto incluido) y
      # el build arg de la web desde el .env, para que `up` use las imagenes
      # ya construidas sin reconstruir.
      - name: Resolve compose image tags
        id: imgs
        run: |
          compose_json=$(docker compose config --format json)
          echo "api=$(echo "$compose_json" | jq -r '.services.api.image')" >> "$GITHUB_OUTPUT"
          echo "worker=$(echo "$compose_json" | jq -r '.services.worker.image')" >> "$GITHUB_OUTPUT"
          echo "web=$(echo "$compose_json" | jq -r '.services.web.image')" >> "$GITHUB_OUTPUT"
          echo "vite_api_url=$(echo "$compose_json" | jq -r '.services.web.build.args.VITE_API_URL')" >> "$GITHUB_OUTPUT"

      # Cache de capas GHA: los runners efimeros no conservan la cache local de
      # buildkit; con type=gha el rebuild cae a segundos cuando los contextos
      # (sgsst-api/sgsst-web) no cambian entre runs. mode=max cachea todas las
      # capas, no solo la final.
      - name: Build api/worker image
        uses: docker/build-push-action@v6
        with:
          context: ./sgsst-api
          tags: |
            ${{ steps.imgs.outputs.api }}
            ${{ steps.imgs.outputs.worker }}
          load: true
          cache-from: type=gha,scope=sgsst-api
          cache-to: type=gha,mode=max,scope=sgsst-api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./sgsst-web
          tags: ${{ steps.imgs.outputs.web }}
          build-args: |
            VITE_API_URL=${{ steps.imgs.outputs.vite_api_url }}
          load: true
          cache-from: type=gha,scope=sgsst-web
          cache-to: type=gha,mode=max,scope=sgsst-web

      - name: Start stack and wait for health
        run: docker compose up -d --wait --wait-timeout 420

      - name: Check stack health (compose sin prod local)
        run: bash scripts/check-env-health.sh 3001 5176 skip skip

      - name: Assert network integrity (dev-stack-recover)
        run: bash scripts/dev-stack-recover.sh

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          scripts=$(git ls-files '*.sh')
          test -n "$scripts" || { echo "No shell scripts found"; exit 1; }
          echo "Linting: $scripts"
          docker run --rm -v "$PWD:/mnt:ro" --workdir /mnt \
            koalaman/shellcheck:stable $scripts
