services:
  postgres:
    image: postgres:16-alpine
    container_name: sgsst_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sgsst}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgsst"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sgsst_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./sgsst-api
    container_name: sgsst_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sgsst}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      PASSWORD_RESET_EXPIRES_MINUTES: ${PASSWORD_RESET_EXPIRES_MINUTES:-30}
      LOGIN_LOCKOUT_MAX_ATTEMPTS: ${LOGIN_LOCKOUT_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5176}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      UPLOADS_PATH: ${UPLOADS_PATH:-uploads}
      DOCUMENT_STORAGE_DRIVER: ${DOCUMENT_STORAGE_DRIVER:-local}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be configured}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-30}
      NOTIFICATIONS_QUEUE_ENABLED: ${NOTIFICATIONS_QUEUE_ENABLED:-true}
      NOTIFICATIONS_WORKER_ENABLED: "false"
      NOTIFICATIONS_CRON: ${NOTIFICATIONS_CRON:-0 7 * * *}
      REPORTS_QUEUE_ENABLED: ${REPORTS_QUEUE_ENABLED:-true}
      REPORTS_WORKER_ENABLED: "false"
      REPORTS_CLEANUP_CRON: ${REPORTS_CLEANUP_CRON:-0 3 * * *}
      REPORTS_METRICS_CRON: ${REPORTS_METRICS_CRON:-30 3 * * *}
      REPORTS_ALERTS_CRON: ${REPORTS_ALERTS_CRON:-0 4 * * *}
      REPORT_ALERTS_ENABLED: ${REPORT_ALERTS_ENABLED:-true}
      REPORT_FAILURE_RATE_ALERT_PERCENT: ${REPORT_FAILURE_RATE_ALERT_PERCENT:-20}
      REPORT_STORAGE_ALERT_BYTES: ${REPORT_STORAGE_ALERT_BYTES:-1073741824}
      REPORT_EXPORT_EXPIRATION_DAYS: ${REPORT_EXPORT_EXPIRATION_DAYS:-7}
      REPORT_EXPORT_RETENTION_DAYS: ${REPORT_EXPORT_RETENTION_DAYS:-7}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v20.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      EXTERNAL_DELIVERY_RETRY_CRON: ${EXTERNAL_DELIVERY_RETRY_CRON:-*/10 * * * *}
      EXTERNAL_DELIVERY_MAX_ATTEMPTS: ${EXTERNAL_DELIVERY_MAX_ATTEMPTS:-3}
      EXTERNAL_DELIVERY_RETRY_BASE_SECONDS: ${EXTERNAL_DELIVERY_RETRY_BASE_SECONDS:-300}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - document_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:' + (process.env.PORT || 3001) + '/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      # Arranque en frio: migrate deploy + boot de Nest en hosts lentos (CI)
      # puede tardar mas de un minuto; ese periodo no cuenta como fallo.
      start_period: 120s
      retries: 10

  worker:
    build:
      context: ./sgsst-api
    container_name: sgsst_worker
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sgsst}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      PASSWORD_RESET_EXPIRES_MINUTES: ${PASSWORD_RESET_EXPIRES_MINUTES:-30}
      LOGIN_LOCKOUT_MAX_ATTEMPTS: ${LOGIN_LOCKOUT_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5176}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      UPLOADS_PATH: ${UPLOADS_PATH:-uploads}
      DOCUMENT_STORAGE_DRIVER: ${DOCUMENT_STORAGE_DRIVER:-local}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be configured}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-30}
      NOTIFICATIONS_QUEUE_ENABLED: ${NOTIFICATIONS_QUEUE_ENABLED:-true}
      NOTIFICATIONS_WORKER_ENABLED: "true"
      NOTIFICATIONS_CRON: ${NOTIFICATIONS_CRON:-0 7 * * *}
      REPORTS_QUEUE_ENABLED: ${REPORTS_QUEUE_ENABLED:-true}
      REPORTS_WORKER_ENABLED: "true"
      REPORTS_CLEANUP_CRON: ${REPORTS_CLEANUP_CRON:-0 3 * * *}
      REPORTS_METRICS_CRON: ${REPORTS_METRICS_CRON:-30 3 * * *}
      REPORTS_ALERTS_CRON: ${REPORTS_ALERTS_CRON:-0 4 * * *}
      REPORT_ALERTS_ENABLED: ${REPORT_ALERTS_ENABLED:-true}
      REPORT_FAILURE_RATE_ALERT_PERCENT: ${REPORT_FAILURE_RATE_ALERT_PERCENT:-20}
      REPORT_STORAGE_ALERT_BYTES: ${REPORT_STORAGE_ALERT_BYTES:-1073741824}
      REPORT_EXPORT_EXPIRATION_DAYS: ${REPORT_EXPORT_EXPIRATION_DAYS:-7}
      REPORT_EXPORT_RETENTION_DAYS: ${REPORT_EXPORT_RETENTION_DAYS:-7}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v20.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      EXTERNAL_DELIVERY_RETRY_CRON: ${EXTERNAL_DELIVERY_RETRY_CRON:-*/10 * * * *}
      EXTERNAL_DELIVERY_MAX_ATTEMPTS: ${EXTERNAL_DELIVERY_MAX_ATTEMPTS:-3}
      EXTERNAL_DELIVERY_RETRY_BASE_SECONDS: ${EXTERNAL_DELIVERY_RETRY_BASE_SECONDS:-300}
    volumes:
      - document_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./sgsst-web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api/v1}
    container_name: sgsst_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5176}:80"
    depends_on:
      - api

  postgres-backup:
    build:
      context: ./docker/postgres-backup
    image: sgsst-postgres-backup:local
    container_name: sgsst_postgres_backup
    restart: unless-stopped
    profiles:
      - backup
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sgsst}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_STALENESS_HOURS: ${BACKUP_STALENESS_HOURS:-24}
      BACKUP_ENCRYPTION_PUBLIC_KEY: ${BACKUP_ENCRYPTION_PUBLIC_KEY:-}
      BACKUP_ALERT_EMAIL_ENABLED: ${BACKUP_ALERT_EMAIL_ENABLED:-false}
      BACKUP_ALERT_EMAIL_TO: ${BACKUP_ALERT_EMAIL_TO:-}
      BACKUP_ALERT_COOLDOWN_MINUTES: ${BACKUP_ALERT_COOLDOWN_MINUTES:-360}
      BACKUP_RESTORE_CHECK_DAYS: ${BACKUP_RESTORE_CHECK_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    # MinIO se publica ahora en quay.io (el tag de Docker Hub fue retirado).
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sgsst_minio
    restart: unless-stopped
    profiles:
      - storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  document_uploads:
  redis_data:
  minio_data:
